name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. POST /api/login with ...
        2. GET /api/tickets
        3. See error
  - type: input
    id: version
    attributes:
      label: Node version
      placeholder: "20.x"
